name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatting (ruff)
        run: ruff format --check .

      - name: Tests (fake Meta, no real key, no credits used)
        run: python -m unittest discover -s tests -t . -v

      - name: Startup check (service boots and answers /health)
        env:
          SERVICE_TOKEN: ci-only-token-not-a-secret-0123456789abcdef
          META_AI_ENABLED: "false"
        run: |
          python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8090 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8090/health; then echo; exit 0; fi
            sleep 0.5
          done
          echo "Service did not start" && exit 1

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
