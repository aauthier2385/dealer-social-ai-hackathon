[project]
name = "dealer-social-ai"
version = "0.1.0"
description = "Meta-powered AI service for The Dealer Social (Meta Global AI Developer Hackathon)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = ["S101", "N818"]  # assert in tests; exception names read better without "Error"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S310", "E501", "N802"]
"app/meta_client.py" = ["S310"]  # urllib is used on purpose; the base URL is forced to https://
